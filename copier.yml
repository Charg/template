---
# Copier template for Charg projects. Generate with `just new <path>`, update with `just update <path>`
# (or `copier update` inside the project). See README.md.

_min_copier_version: "9.4.0"
_subdirectory: template
_answers_file: .copier-answers.yml
_templates_suffix: .jinja

# GitHub Actions (`${{ }}`) and just (`{{ }}`) both use Jinja's default delimiters, so the template
# uses [[ ]] / [% %] / [# #] instead. Avoid bash `[[ ]]` tests in *.jinja files.
_envops:
  block_start_string: "[%"
  block_end_string: "%]"
  variable_start_string: "[["
  variable_end_string: "]]"
  comment_start_string: "[#"
  comment_end_string: "#]"
  trim_blocks: true
  lstrip_blocks: true
  keep_trailing_newline: true

# Created once, then owned by the project: `copier update` never touches them again.
_skip_if_exists:
  - README.md
  - CLAUDE.md

_exclude:
  - "[% if not github %].github[% endif %]"
  # Whole files a flavour brings; see `flavours` below.
  - "[% if 'go' not in flavours %].golangci.yml[% endif %]"
  - "[% if 'go' not in flavours %]hack/lint.d/go.sh[% endif %]"
  - "[% if 'container-images' not in flavours %].hadolint.yaml[% endif %]"
  - "[% if 'container-images' not in flavours %]hack/lint.d/container-images.sh[% endif %]"
  - "[% if 'helm-charts' not in flavours %]ct.yaml[% endif %]"
  - "[% if 'helm-charts' not in flavours %]hack/lint.d/helm-charts.sh[% endif %]"
  - "[% if 'python' not in flavours %]ruff.toml[% endif %]"
  - "[% if 'python' not in flavours %]hack/lint.d/python.sh[% endif %]"

project_name:
  type: str
  help: Project name (usually the repo name)
  default: "[[ _folder_name ]]"
  validator: >-
    [% if not (project_name | regex_search('^[a-z0-9][a-z0-9._-]*$')) %]Use lowercase letters, digits, '.', '_' or
    '-'[% endif %]

description:
  type: str
  help: One-line description (flake description, README, AGENTS.md)
  validator: "[% if not description %]Required[% endif %]"

github:
  type: bool
  help: Hosted on GitHub? (no = offline repo, commits straight to main, no .github/)
  default: true

nixpkgs_channel:
  type: str
  help: nixpkgs branch the dev shell follows
  default: nixos-26.05
  choices:
    - nixos-26.05
    - nixos-unstable

# A flavour is a toolchain layer: its tools in the flake, a lint step in hack/lint.d/, config,
# Renovate rules (renovate/<flavour>.json5), .gitignore entries and an AGENTS.md section. Add one to
# an existing project with `copier update --data 'flavours=[go,python]'` (list them all).
flavours:
  type: str
  help: Toolchain flavours (space toggles, enter accepts; none is fine)
  multiselect: true
  choices:
    "go: Go toolchain, golangci-lint": go
    "container-images: Dockerfiles, docker buildx, hadolint": container-images
    "helm-charts: helm 3, chart-testing, kubeconform for charts/*": helm-charts
    "python: python3, ruff": python
  default: []
  validator: >-
    [% if 'helm-charts' in flavours and nixpkgs_channel != 'nixos-26.05' %]helm-charts needs
    nixpkgs_channel nixos-26.05: nixos-unstable ships helm 4[% endif %]

# Not asked: fixed values the templates reference.
template_repo:
  type: str
  default: Charg/template
  when: false
