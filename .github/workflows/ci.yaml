---
name: ci

on:
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install nix
        uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5

      - name: Lint
        run: nix develop -c just lint

  test:
    name: test (${{ matrix.variant }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Every variant in hack/test.sh's ALL_VARIANTS, one job each: each builds its own dev shell.
        variant:
          - github
          - offline
          - unstable
          - go
          - container-images
          - helm-charts
          - python
          - combo
          - update
          - helm-unstable
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Copier renders from git history (--vcs-ref=HEAD).
          fetch-depth: 0

      - name: Install nix
        uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5

      - name: Render and check the variant
        env:
          VARIANT: ${{ matrix.variant }}
        run: nix develop -c just test "${VARIANT}"

  # The one check main's ruleset requires, so adding or renaming jobs never touches the ruleset.
  ci:
    name: ci
    if: always()
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to succeed or be skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in ${RESULTS}; do
            case "${result}" in
              success | skipped) ;;
              *) echo "a required job ended with: ${result}" >&2; exit 1 ;;
            esac
          done
